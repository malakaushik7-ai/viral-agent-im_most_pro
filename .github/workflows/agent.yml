name: Anime Video Bot

on:
  schedule:
    - cron: '0 */3 * * *'  # har 3 ghante
  workflow_dispatch:  # manual run ke liye

jobs:
  generate_video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Generate Anime Video
        run: python agent.py
      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-video
          path: outputs/

  upload_youtube:
    needs: generate_video
    runs-on: ubuntu-latest
    environment: approval  # <-- Yahi approve wala button laayega
    steps:
      - name: Download Video
        uses: actions/download-artifact@v4
        with:
          name: anime-video
      - name: Upload to YouTube
        run: python upload_youtube.py
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
